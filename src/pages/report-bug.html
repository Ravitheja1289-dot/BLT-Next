<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report a Bug - OWASP BLT</title>
    <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon">
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
    <script>
        (function() {
            var theme = localStorage.getItem('blt-theme');
            if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
    <link rel="stylesheet" href="../assets/css/main.css">
    <script src="https://unpkg.com/htmx.org@1.9.10" defer></script>
    <script src="../assets/js/main.js" type="module" defer></script>
</head>

<body>
    <header class="header">
        <div class="container">
            <nav class="nav">
                <div class="nav-brand">
                    <a href="/" class="logo">
                        <span class="logo-text">OWASP BLT</span>
                    </a>
                </div>
                <ul class="nav-menu">
                    <li><a href="../index.html" class="nav-link">Home</a></li>
                    <li><a href="report-bug.html" class="nav-link">Report Bug</a></li>
                    <li><a href="leaderboard.html" class="nav-link">Leaderboard</a></li>
                    <li><a href="projects.html" class="nav-link">Projects</a></li>
                    <li><a href="about.html" class="nav-link">About</a></li>
                </ul>
                <div class="nav-actions">
                    <button id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
                        <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" /></svg>
                        <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" /></svg>
                    </button>
                    <button class="btn btn-secondary" id="loginBtn">Login</button>
                    <button class="btn btn-primary" id="signupBtn">Sign Up</button>
                </div>
            </nav>
        </div>
    </header>

    <main class="main">
        <section class="container" style="padding: 3rem 0;">
            <h1 class="section-title">Report a Bug</h1>
            <p class="text-center" style="color: var(--color-text-secondary); margin-bottom: 3rem;">
                Help make the internet more secure by reporting bugs and vulnerabilities
            </p>

            <div style="max-width: 800px; margin: 0 auto;">
                <form id="bugReportForm" hx-post="/api/bugs" hx-swap="outerHTML"
                    style="background: var(--color-surface); padding: 2rem; border-radius: 0.5rem; border: 1px solid var(--color-border);">

                    <div style="margin-bottom: 1.5rem;">
                        <label style="display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--color-text-primary);">
                            Bug Title *
                        </label>
                        <input type="text" name="title" required placeholder="Brief description of the bug"
                            style="width: 100%; padding: 0.75rem; border: 1px solid var(--color-input-border); border-radius: 0.375rem; font-size: 1rem; background: var(--color-input-bg); color: var(--color-text-primary);" />
                    </div>

                    <div style="margin-bottom: 1.5rem;">
                        <label style="display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--color-text-primary);">
                            Project/URL *
                        </label>
                        <input type="url" name="url" required placeholder="https://example.com"
                            style="width: 100%; padding: 0.75rem; border: 1px solid var(--color-input-border); border-radius: 0.375rem; font-size: 1rem; background: var(--color-input-bg); color: var(--color-text-primary);" />
                    </div>

                    <div style="margin-bottom: 1.5rem;">
                        <label style="display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--color-text-primary);">
                            Severity *
                        </label>
                        <select name="severity" required
                            style="width: 100%; padding: 0.75rem; border: 1px solid var(--color-input-border); border-radius: 0.375rem; font-size: 1rem; background: var(--color-input-bg); color: var(--color-text-primary);">
                            <option value="">Select severity</option>
                            <option value="critical">Critical</option>
                            <option value="high">High</option>
                            <option value="medium">Medium</option>
                            <option value="low">Low</option>
                            <option value="info">Informational</option>
                        </select>
                    </div>

                    <div style="margin-bottom: 1.5rem;">
                        <label style="display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--color-text-primary);">
                            Bug Type *
                        </label>
                        <select name="type" required
                            style="width: 100%; padding: 0.75rem; border: 1px solid var(--color-input-border); border-radius: 0.375rem; font-size: 1rem; background: var(--color-input-bg); color: var(--color-text-primary);">
                            <option value="">Select type</option>
                            <option value="security">Security Vulnerability</option>
                            <option value="functional">Functional Bug</option>
                            <option value="ui">UI/UX Issue</option>
                            <option value="performance">Performance Issue</option>
                            <option value="other">Other</option>
                        </select>
                    </div>

                    <div style="margin-bottom: 1.5rem;">
                        <label style="display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--color-text-primary);">
                            Description *
                        </label>
                        <textarea name="description" required rows="6"
                            placeholder="Detailed description of the bug, steps to reproduce, and impact"
                            style="width: 100%; padding: 0.75rem; border: 1px solid var(--color-input-border); border-radius: 0.375rem; font-size: 1rem; resize: vertical; background: var(--color-input-bg); color: var(--color-text-primary);"></textarea>
                    </div>

                    <div style="margin-bottom: 1.5rem;">
                        <label style="display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--color-text-primary);">
                            Steps to Reproduce
                        </label>
                        <textarea name="steps" rows="4" placeholder="1. Go to...&#10;2. Click on...&#10;3. Observe..."
                            style="width: 100%; padding: 0.75rem; border: 1px solid var(--color-input-border); border-radius: 0.375rem; font-size: 1rem; resize: vertical; background: var(--color-input-bg); color: var(--color-text-primary);"></textarea>
                    </div>

                    <div style="margin-bottom: 2rem;">
                        <label style="display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--color-text-primary);">
                            Proof of Concept / Screenshots
                        </label>
                        <input type="file" name="attachments" multiple accept="image/*,.pdf"
                            style="width: 100%; padding: 0.75rem; border: 1px solid var(--color-input-border); border-radius: 0.375rem; background: var(--color-input-bg); color: var(--color-text-primary);" />
                    </div>

                    <div style="display: flex; gap: 1rem; justify-content: flex-end;">
                        <a href="/" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">Submit Bug Report</button>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 OWASP BLT. Licensed under AGPL-3.0.</p>
            </div>
        </div>
    </footer>

    <div id="authModal" class="modal" style="display: none;"></div>
</body>

</html>
