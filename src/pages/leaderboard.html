<!DOCTYPE html>
<html lang="en" class="">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard - OWASP BLT</title>
    <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon">
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
    <script>
        (function() {
            var theme = localStorage.getItem('blt-theme');
            if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
    <link rel="stylesheet" href="../assets/css/main.css">
    <script src="https://unpkg.com/htmx.org@1.9.10" defer></script>
    <script src="../assets/js/main.js" type="module" defer></script>

<body>
    <header class="header">
        <div class="container">
            <nav class="nav">
                <div class="nav-brand">
                    <a href="/" class="logo">
                        <span class="logo-text">OWASP BLT</span>
                    </a>
                </div>
                <ul class="nav-menu">
                    <li><a href="../index.html" class="nav-link">Home</a></li>
                    <li><a href="report-bug.html" class="nav-link">Report Bug</a></li>
                    <li><a href="leaderboard.html" class="nav-link">Leaderboard</a></li>
                    <li><a href="projects.html" class="nav-link">Projects</a></li>
                    <li><a href="about.html" class="nav-link">About</a></li>
                </ul>
                <div class="nav-actions">
                    <button id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
                        <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" /></svg>
                        <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" /></svg>
                    </button>
                    <button class="btn btn-secondary" id="loginBtn">Login</button>
                    <button class="btn btn-primary" id="signupBtn">Sign Up</button>
                </div>
            </nav>
        </div>
    </header>

    <main class="main">
        <section class="container" style="padding: 3rem 0;">
            <h1 class="section-title">Leaderboard</h1>
            <p class="text-center" style="color: var(--color-text-secondary); margin-bottom: 3rem;">
                Top security researchers making the internet safer
            </p>

            <div hx-get="/api/leaderboard" hx-trigger="load" hx-swap="innerHTML"
                style="max-width: 900px; margin: 0 auto;">

                <div style="text-align: center; padding: 3rem;">
                    <div style="font-size: 2rem; margin-bottom: 1rem;">⏳</div>
                    <p style="color: var(--color-text-muted);">Loading leaderboard...</p>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 OWASP BLT. Licensed under AGPL-3.0.</p>
            </div>
        </div>
      </div>
    </div>
  </header>

  <main role="main">

    <style>
        .leaderboard-table {
            width: 100%;
            background: var(--color-surface);
            border-radius: 0.5rem;
            overflow: hidden;
            border: 1px solid var(--color-border);
        }

        .leaderboard-row {
            display: grid;
            grid-template-columns: 80px 1fr 120px 120px;
            padding: 1.25rem;
            border-bottom: 1px solid var(--color-border);
            transition: background-color 0.15s;
        }

        .leaderboard-row:hover {
            background-color: var(--color-surface-hover);
        }

        <!-- Table -->
        <div class="border border-[#E5E5E5] dark:border-gray-700 rounded-lg overflow-hidden">

            <div class="text-[10px] font-semibold uppercase tracking-widest text-gray-400 dark:text-gray-500">Researcher</div>
            <div class="text-[10px] font-semibold uppercase tracking-widest text-gray-400 dark:text-gray-500 text-center">Bugs</div>

                <div class="w-8 h-8 rounded-full bg-red-600 dark:bg-red-500 text-white text-xs font-bold flex items-center justify-center shrink-0">AK</div>
                <span class="text-sm font-medium text-gray-900 dark:text-gray-100">alex_k</span>
              </div>
              <div class="text-center text-sm font-semibold text-red-600 dark:text-red-400">142</div>
              <div class="text-center text-sm font-semibold text-red-600 dark:text-red-400">8,420</div>
              <div class="text-center text-sm text-gray-500 dark:text-gray-400">$1,200</div>

              <div class="text-center text-sm font-bold text-gray-400 dark:text-gray-500">2</div>

                <span class="text-sm font-medium text-gray-900 dark:text-gray-100">s_researcher</span>

                <span class="text-sm font-medium text-gray-900 dark:text-gray-100">mjhacks</span>
              </div>
              <div class="text-center text-sm font-semibold text-red-600 dark:text-red-400">97</div>
              <div class="text-center text-sm font-semibold text-red-600 dark:text-red-400">5,320</div>
              <div class="text-center text-sm text-gray-500 dark:text-gray-400">$720</div>
            </div>
            <div class="grid grid-cols-[44px_1fr_80px_80px_80px] items-center px-4 py-3.5 border-b border-[#E5E5E5] dark:border-gray-800 hover:bg-gray-50 dark:hover:bg-gray-800/40 transition-colors">

                <div class="w-8 h-8 rounded-full bg-blue-500 text-white text-xs font-bold flex items-center justify-center shrink-0">PW</div>
                <span class="text-sm font-medium text-gray-900 dark:text-gray-100">p_white</span>
              </div>
              <div class="text-center text-sm font-semibold text-red-600 dark:text-red-400">84</div>
              <div class="text-center text-sm font-semibold text-red-600 dark:text-red-400">4,100</div>
              <div class="text-center text-sm text-gray-500 dark:text-gray-400">$540</div>
            </div>
            <div class="grid grid-cols-[44px_1fr_80px_80px_80px] items-center px-4 py-3.5 hover:bg-gray-50 dark:hover:bg-gray-800/40 transition-colors">
              <div class="text-center text-sm font-bold text-gray-400 dark:text-gray-500">5</div>
              <div class="flex items-center gap-3">

            background-color: var(--color-bg-alt);
            font-weight: 600;

        .username {
            font-weight: 600;
            color: var(--color-text-primary);
        }

        .stat {
